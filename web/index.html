 if(LIST.length>SM)h+='<button id="more">عرض المزيد ('+(LIST.length-SM)+")</button>";$("cv").innerHTML=h}

async function check(){
 try{
  const r=await fetch("version.json",{cache:"no-store"});if(!r.ok)throw 0;
  const j=await r.json(),v=j.v;
  if(v!==(cur&&cur.v)||j.s!==(cur&&cur.sig&&cur.sig.slice(0,8))){const d=await (await fetch("data.json",{cache:"no-store"})).json();cur=d;save(d);apply(d,true);stamp()}
  setSync("✓ متصل · نسخة "+cur.v+(LU?" · اتحدّث "+LU:""))
 }catch(e){setSync(cur?"بدون إنترنت · نسخة "+cur.v+" محفوظة":"مفيش اتصال ومفيش نسخة محفوظة")}
}
let cur=null,LU="";const stamp=()=>{LU=new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit",second:"2-digit"})};
async function pull(){const d=await (await fetch("data.json",{cache:"no-store"})).json();cur=d;save(d);apply(d,true);stamp();setSync("✓ متصل · نسخة "+d.v+" · اتحدّث "+LU)}
try{cur=JSON.parse(localStorage.getItem(KEY))}catch(e){}

try{const es=new EventSource("events");es.onmessage=e=>{if(+e.data!==(cur&&cur.v))pull().catch(check)}}catch(e){}
