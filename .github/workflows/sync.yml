name: sync-makhzan
on:
  schedule: [{cron: "*/10 * * * *"}]      # كل ~10 دقايق
  workflow_dispatch: {inputs: {force: {description: "انشر حتى لو مفيش تغيير", default: "0"}}}
  push: {branches: [main]}                 # أي تعديل في الكود يتنشر فورًا
concurrency: {group: makhzan, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - id: build
        run: python cloud_build.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          CF_PROJECT: ${{ secrets.CF_PROJECT }}
          CF_URL: ${{ secrets.CF_URL }}
          FORCE: ${{ (github.event_name == 'push' || github.event.inputs.force == '1') && '1' || '0' }}
      - if: steps.build.outputs.changed == 'true'
        run: npx --yes wrangler@3 pages deploy site --project-name "${{ secrets.CF_PROJECT }}" --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
